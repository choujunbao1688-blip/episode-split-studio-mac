name: Build signed macOS app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require distribution credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name}; a signed and notarized DMG cannot be produced."
              exit 1
            fi
          done
      - name: Install build dependencies
        run: |
          npm install
          python -m pip install Pillow pyinstaller
      - name: Package media engine
        run: |
          pyinstaller --noconfirm --clean --onefile --name episode-agent --add-data 'agent/fonts:fonts' agent/agent.py
          mkdir -p build/agent-dist
          cp dist/episode-agent build/agent-dist/episode-agent
          node scripts/prepare-binaries.js
          swiftc -O -framework Vision -framework AppKit scripts/ocr.swift -o build/bin/episode-ocr
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/whisper-build" --target whisper-cli --parallel 4
          cp "$RUNNER_TEMP/whisper-build/bin/whisper-cli" build/bin/whisper-cli
          mkdir -p build/models
          curl --fail --location --retry 3 --silent --show-error https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin -o build/models/ggml-base.bin
          test "$(stat -f%z build/models/ggml-base.bin)" -gt 100000000
          build/bin/ffmpeg -version
          build/bin/ffprobe -version
          PATH="$PWD/build/bin:$PATH" build/agent-dist/episode-agent --help
      - name: Sign and notarize Apple Silicon DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac
      - name: Verify distribution
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/拆集工作台.app"
          spctl --assess --verbose --type exec "release/mac-arm64/拆集工作台.app"
          xcrun stapler validate "release/mac-arm64/拆集工作台.app"
          hdiutil verify "release/拆集工作台-0.1.4-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-split-studio-mac-arm64-signed
          path: release/*.dmg
          if-no-files-found: error
