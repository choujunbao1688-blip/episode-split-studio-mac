name: Build ad-hoc Mac test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-adhoc-test.yml
      - agent/**
      - web/**
      - tests/**
      - package.json
      - main.js
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm install
          python -m pip install Pillow pyinstaller
      - name: Check state saves and poster preview
        run: |
          python -m unittest discover -s tests -v
          python -c "from pathlib import Path; s=Path('web/index.html').read_text(); Path('web-check.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check web-check.js
      - name: Package processing engine
        run: |
          pyinstaller --noconfirm --clean --onefile --name episode-agent --add-data 'agent/fonts:fonts' agent/agent.py
          mkdir -p build/agent-dist
          cp dist/episode-agent build/agent-dist/episode-agent
          node scripts/prepare-binaries.js
      - name: Build local text and speech recognition
        run: |
          swiftc -O -framework Vision -framework AppKit scripts/ocr.swift -o build/bin/episode-ocr
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/whisper-build" --target whisper-cli --parallel 4
          cp "$RUNNER_TEMP/whisper-build/bin/whisper-cli" build/bin/whisper-cli
          mkdir -p build/models
          curl --fail --location --retry 3 --silent --show-error https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin -o build/models/ggml-base.bin
          test "$(stat -f%z build/models/ggml-base.bin)" -gt 100000000
          python - <<'PY'
          import math, os, struct, wave
          path=os.path.join(os.environ['RUNNER_TEMP'],'speech-smoke.wav')
          with wave.open(path,'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(16000)
              wav.writeframes(b''.join(struct.pack('<h',int(500*math.sin(2*math.pi*440*i/16000))) for i in range(16000)))
          PY
          build/bin/whisper-cli -m build/models/ggml-base.bin -f "$RUNNER_TEMP/speech-smoke.wav" -l en -np -otxt -of "$RUNNER_TEMP/speech-smoke"
      - name: Check packaged FFmpeg media effects
        run: |
          PATH="$PWD/build/bin:$PATH" python -m unittest discover -s tests -p 'test_media_effects.py' -v
      - name: Create ad-hoc signed test DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never \
            -c.mac.identity=- \
            -c.mac.notarize=false \
            -c.mac.entitlements=build/entitlements.mac.adhoc.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.adhoc.inherit.plist \
            -c.dmg.artifactName=episode-split-studio-0.1.7-beta.6-arm64-adhoc-test.dmg
      - name: Verify signature and engine startup
        run: |
          app="release/mac-arm64/拆集工作台.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          python - <<'PY'
          import subprocess
          executable='release/mac-arm64/拆集工作台.app/Contents/MacOS/拆集工作台'
          result=subprocess.run([executable,'--self-test'],capture_output=True,text=True,timeout=45)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode==0, f'Packaged app failed with exit code {result.returncode}'
          assert 'Packaged engine health check passed' in result.stdout
          PY
          hdiutil verify release/episode-split-studio-0.1.7-beta.6-arm64-adhoc-test.dmg
          mkdir -p "$RUNNER_TEMP/episode-mounted"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/episode-mounted" release/episode-split-studio-0.1.7-beta.6-arm64-adhoc-test.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/episode-mounted/拆集工作台.app"
          hdiutil detach "$RUNNER_TEMP/episode-mounted"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-split-studio-arm64-adhoc-test-v017-beta6
          path: release/episode-split-studio-0.1.7-beta.6-arm64-adhoc-test.dmg
          if-no-files-found: error

