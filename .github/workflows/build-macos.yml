name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm install
          python -m pip install Pillow pyinstaller
      - name: Package media engine
        run: |
          pyinstaller --noconfirm --clean --onefile --name episode-agent --add-data 'agent/fonts:fonts' agent/agent.py
          mkdir -p build
          cp dist/episode-agent build/episode-agent
          node scripts/prepare-binaries.js
          build/bin/ffmpeg -version
          build/bin/ffprobe -version
          build/episode-agent --help
      - name: Build Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: episode-split-studio-mac-arm64
          path: release/*.dmg
